---
# Configured via env + extra_params (--o:... overrides coolwsd.xml), so the
# container stays stateless and a changed setting simply recreates it.
- name: Start {{ role_name }} container {{ collabora_code_hostname }}
  community.docker.docker_container:
    name: "{{ collabora_code_hostname }}"
    labels:
      description: "{{ collabora_code_description }}"
    image: "{{ collabora_code_image }}"
    restart_policy: unless-stopped
    capabilities:
      - MKNOD
    env: "{{ collabora_code_env | combine(collabora_code_aliasgroup_env) }}"
    ports: "{{ collabora_code_ports }}"
    networks:
      - name: "{{ docker_network_name }}"
  vars:
    collabora_code_env:
      username: "{{ collabora_code_username }}"
      password: "{{ collabora_code_password }}"
      server_name: "{{ collabora_code_server_name }}"
      DONT_GEN_SSL_CERT: "{{ 'false' if collabora_code_ssl_enabled else 'true' }}"
      extra_params: >-
        --o:ssl.enable={{ collabora_code_ssl_enabled | lower }}
        --o:ssl.termination={{ collabora_code_ssl_termination | lower }}
        {{ ('--o:remote_font_config.url=' ~ collabora_code_remote_font_config_url) if collabora_code_remote_font_config_url is defined else '' }}
        {{ collabora_code_extra_params }}
    # aliasgroup1, aliasgroup2, ... from the list
    collabora_code_aliasgroup_env: >-
      {{ dict(range(1, collabora_code_aliasgroups | length + 1)
         | map('string') | map('regex_replace', '^', 'aliasgroup')
         | zip(collabora_code_aliasgroups)) }}
