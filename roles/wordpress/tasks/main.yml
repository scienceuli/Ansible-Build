---
- name: On build set new image tag {{ role_name }}:{{ wordpress_hostname }}
  ansible.builtin.set_fact:
    wordpress_image: wordpress:{{ wordpress_hostname }}
    wordpress_build_image: "{{ wordpress_image }}"
  when: wordpress_build_image and wordpress_build_image != wordpress_image
  tags:
    - wordpress

- name: Include {{ role_name }} build tasks
  ansible.builtin.include_tasks: "{{ role_name }}_build.yml"
  when: wordpress_build_image and wordpress_build_image != wordpress_image
  tags:
    - wordpress

- name: Include {{ role_name }} tasks
  ansible.builtin.include_tasks: "{{ role_name }}.yml"
  when: wordpress_image is defined
  tags:
    - wordpress

# After the container: on an empty volume the image copies WordPress core
# (and wp-content) in on the first start
- name: Include {{ role_name }} themes tasks
  ansible.builtin.include_tasks:
    file: "{{ role_name }}_themes.yml"
    # the included tasks need the tag too, for -t wordpress_themes
    apply:
      tags:
        - wordpress_themes
  when: wordpress_themes | length > 0
  tags:
    - wordpress
    - wordpress_themes
