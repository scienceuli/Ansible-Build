{% for sync in rclone_sync %}
{% if sync.dest_provider == 'sftp' %}
[{{ sync.name }}]
type = sftp
host = {{ sync.host }}
user = {{ sync.user }}
{% if sync.port is defined %}
port = {{ sync.port }}
{% endif %}
{% if sync.pass is defined %}
pass = {{ sync.pass }}
{% endif %}
{% if sync.key_file is defined %}
key_file = {{ sync.key_file }}
{% endif %}
{% if sync.known_hosts_file is defined %}
known_hosts_file = {{ sync.known_hosts_file }}
{% endif %}
{% endif %}
{% endfor %}
