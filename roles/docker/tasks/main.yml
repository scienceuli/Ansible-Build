---
# roles/docker/tasks/main.yml
#
# Installs Docker Engine + the Compose V2 plugin from Docker's official apt
# repo (not Debian's docker.io/docker-compose, which is Compose V1 and
# incompatible with community.docker.docker_compose_v2).

- name: Install apt prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3-debian   # required by the deb822_repository module
    state: present
    update_cache: true

- name: Add Docker's official apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"
    suites: "{{ ansible_distribution_release }}"
    components: stable
    signed_by: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    state: present
  register: docker_repo

- name: Update apt cache after adding Docker repo
  ansible.builtin.apt:
    update_cache: true
  when: docker_repo.changed

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: Ensure docker service is enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
