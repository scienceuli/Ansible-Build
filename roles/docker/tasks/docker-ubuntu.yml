---
- name: Add {{ role_name }} gpg apt key
  ansible.builtin.get_url:
    url: "{{ docker_apt_url }}"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

# Manual installs left docker.list with signed-by=docker.gpg; apt fails on the
# conflicting Signed-By of the repo added below (signed-by=docker.asc).
- name: Remove legacy {{ role_name }} apt source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Add {{ role_name }} repo
  ansible.builtin.apt_repository:
    repo: "{{ docker_apt_repo }}"
    state: present

- name: Install required {{ role_name }} packages
  ansible.builtin.include_role:
    name: packages
  vars:
    group_packages: "{{ docker_packages }}"
  when: docker_packages is defined
