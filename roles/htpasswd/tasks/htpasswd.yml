---
- name: Ensure htpasswd data dir exists
  ansible.builtin.file:
    path: "{{ htpasswd_nginx_data_dir }}"
    state: directory

# community.general.htpasswd needs passlib on the target
- name: Ensure package {{ htpasswd_requires_package }} is installed
  ansible.builtin.package:
    name: "{{ htpasswd_requires_package }}"
    state: present

- name: Add user to htpasswd file
  community.general.htpasswd:
    path: "{{ htpasswd_nginx_data_dir }}/{{ htpasswd_name }}.htpasswd"
    name: "{{ item.username }}"
    password: "{{ item.password }}"
  loop: "{{ htpasswd_credentials }}"
  loop_control:
    label: "{{ item.username }}"   # keep the password out of the output
