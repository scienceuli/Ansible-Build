---
- name: Include docker volume role
  ansible.builtin.include_role:
    name: docker_volume
  vars:
    docker_volume_name: "{{ moodle_volume_name }}"
    docker_volumes:
      - name: "{{ moodle_code_volume_name }}"
    docker_volume_backup_set: "{{ moodle_volume_backup_set | default([]) }}"
  when: moodle_volume_name is defined

- name: Start {{ role_name }} container {{ moodle_hostname }}
  community.docker.docker_container:
    name: "{{ moodle_hostname }}"
    labels:
      description: "{{ moodle_description }}"
    image: "{{ moodle_image }}"
    pull: "{{ moodle_pull }}"
    restart_policy: unless-stopped
    env:
      SITE_URL: "{{ moodle_site_url }}"
      REVERSEPROXY: "{{ moodle_reverseproxy }}"
      SSLPROXY: "{{ moodle_sslproxy }}"
      MOODLE_USERNAME: "{{ moodle_username }}"
      MOODLE_PASSWORD: "{{ moodle_password }}"
      MOODLE_EMAIL: "{{ moodle_email }}"
      # The image passes this unquoted to install.php (breaks on spaces); only
      # used at install, rename the site later in the admin UI.
      MOODLE_SITENAME: "{{ moodle_site_name | replace(' ', '_') }}"
      MOODLE_LANGUAGE: "{{ moodle_language }}"
      DB_TYPE: "{{ moodle_database_type }}"
      DB_HOST: "{{ moodle_database_host }}"
      DB_PORT: "{{ moodle_database_port }}"
      DB_NAME: "{{ moodle_database_name }}"
      DB_USER: "{{ moodle_database_user }}"
      DB_PASS: "{{ moodle_database_password }}"
      SMTP_HOST: "{{ moodle_smtp_host }}"
      SMTP_PORT: "{{ moodle_smtp_port }}"
      SMTP_USER: "{{ moodle_smtp_user }}"
      SMTP_PASSWORD: "{{ moodle_smtp_password }}"
      SMTP_PROTOCOL: "{{ moodle_smtp_protocol }}"
      MOODLE_MAIL_NOREPLY_ADDRESS: "{{ moodle_mail_noreply_address }}"
      upload_max_filesize: "{{ moodle_php_max_upload_filesize }}"
      post_max_size: "{{ moodle_php_max_upload_filesize }}"
      client_max_body_size: "{{ moodle_php_max_upload_filesize }}"
    volumes:
      - "{{ moodle_code_volume_name }}:/var/www/html"
      - "{{ moodle_volume_name }}:/var/www/moodledata"
    networks:
      - name: "{{ docker_network_name }}"
