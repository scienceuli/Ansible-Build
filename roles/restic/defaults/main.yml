---
restic_backup_dir: /var/backup
restic_owner: root
restic_group: backup
restic_repo_type: rest
restic_rest_user: restic
# The rest server behind nginx redirects http to https; a redirected upload
# loses its body, so talk https directly.
restic_rest_scheme: https
restic_backup_rotation:
  last: 14
  daily: 14
  weekly: 4
  monthly: 3
