---
# Shipped by the postgres role; hosts whose Postgres runs in an app's own
# compose stack (e.g. eventmanager-db) never run that role. restore needs
# create and drop.
- name: Copy docker postgres backup/restore scripts
  ansible.builtin.copy:
    src: ../../postgres/files/{{ item }}
    dest: /usr/local/bin/{{ item }}
    mode: "0755"
  loop:
    - docker-postgres-backup
    - docker-postgres-restore
    - docker-postgres-create
    - docker-postgres-drop
  when: restic_backup_set | selectattr('type', 'equalto', 'postgres-dump') | list | length > 0

- name: Register selective docker postgres backup jobs
  ansible.builtin.cron:
    name: "{{ item.id }}"
    hour: "{{ item.hour }}"
    minute: "{{ 59 | random(seed=item.id) }}"
    job: docker-postgres-backup -c {{ item.container }} -d {{ item.databases }} -o {{ restic_backup_dir }} {{ '&& restic-main backup ' + restic_backup_dir + '/'
      + item.container + ' --tag ' + (item.tags | join(' --tag ')) if item.upload | default(true) else '' }}; write-node-exporter-metric -c '{{ item.id }}' -v
      $?
    disabled: "{{ item.disabled | default(false) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ restic_backup_set }}"
  when: item.type == "postgres-dump" and item.databases is defined

- name: Register docker postgres backup jobs
  ansible.builtin.cron:
    name: "{{ item.id }}"
    hour: "{{ item.hour }}"
    minute: "{{ 59 | random(seed=item.id) }}"
    job: docker-postgres-backup -c {{ item.container }} -o {{ restic_backup_dir }} -a {{ '&& restic-main backup ' + restic_backup_dir + '/' + item.container + '
      --tag ' + (item.tags | join(' --tag ')) if item.upload | default(true) else '' }}; write-node-exporter-metric -c '{{ item.id }}' -v $?
    disabled: "{{ item.disabled | default(false) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ restic_backup_set }}"
  when: item.type == "postgres-dump" and item.databases is undefined
