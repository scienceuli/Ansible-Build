---
# roles/label_watcher/tasks/main.yml

- name: Install inotify-tools and mosquitto-clients
  ansible.builtin.apt:
    name:
      - inotify-tools
      - mosquitto-clients
    state: present
    update_cache: true

- name: Deploy watcher script
  ansible.builtin.template:
    src: watch.sh.j2
    dest: /usr/local/bin/homebox-label-watcher.sh
    mode: "0755"
  notify: restart homebox-label-watcher

- name: Deploy systemd unit
  ansible.builtin.template:
    src: homebox-label-watcher.service.j2
    dest: /etc/systemd/system/homebox-label-watcher.service
    mode: "0644"
  notify: restart homebox-label-watcher

- name: Ensure homebox-label-watcher service is enabled and running
  ansible.builtin.systemd:
    name: homebox-label-watcher
    enabled: true
    state: started
    daemon_reload: true
