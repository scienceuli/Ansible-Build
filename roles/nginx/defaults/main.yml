---
nginx_ports:
  - "80:80"
  - "443:443"
nginx_description: Nginx
nginx_data_dir: "/usr/share/{{ nginx_hostname }}"
nginx_cache_enabled: false
# HTTP/2 on the TLS server blocks (needs nginx >= 1.25.1), per proxy: http2
nginx_http2: false
# Resolve proxy upstreams per request instead of once at startup, e.g.
# 127.0.0.11 (Docker's embedded DNS): nginx starts and keeps running when an
# app container is stopped, only that hostname answers 502. Empty = off.
nginx_resolver: ""
