---
- name: Show applied tags
  ansible.builtin.debug:
    var: ansible_run_tags
  tags:
    - always

- name: Check OS and Version
  ansible.builtin.fail:
    msg: This is not Ubuntu 18.04 / 22.04 / 24.04
  when: ansible_distribution != "Ubuntu" or (ansible_distribution_major_version not in ['18', '22', '24'])

- name: Include {{ role_name }} ubuntu1804 tasks
  ansible.builtin.include_tasks: "{{ role_name }}_ubuntu1804.yml"
  when: ansible_distribution_major_version == '18'
  tags:
    - bbb_install

- name: Include {{ role_name }} ubuntu2204 tasks
  ansible.builtin.include_tasks: "{{ role_name }}_ubuntu2204.yml"
  when: ansible_distribution_major_version == '22'
  tags:
    - bbb_install

- name: Include {{ role_name }} ubuntu2404 tasks
  ansible.builtin.include_tasks: "{{ role_name }}_ubuntu2404.yml"
  when: ansible_distribution_major_version == '24'
  tags:
    - bbb_install

- name: Include {{ role_name }} config tasks
  ansible.builtin.include_tasks:
    file: "{{ role_name }}_config.yml"
    apply:
      tags:
        - bbb_install
        - bbb_install_config
  tags:
    - bbb_install
    - bbb_install_config

- name: Include {{ role_name }} aliases tasks
  ansible.builtin.include_tasks:
    file: "{{ role_name }}_aliases.yml"
    apply:
      tags:
        - bbb_install
        - bbb_install_aliases
  when: bbb_install_aliases | length > 0
  tags:
    - bbb_install
    - bbb_install_aliases
