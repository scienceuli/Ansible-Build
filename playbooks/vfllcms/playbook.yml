---
# VFLL Wagtail CMS as docker compose stacks, one inventory host per instance
# (vfllcms_name), see README.md:
#   bohr_vfllcms, bohr_vfllcms_staging on the docker host bohr
# Limit to the instance(s) + their docker host, e.g.
#   uv run ansible-playbook -i inventories playbooks/vfllcms/playbook.yml -l bohr,bohr_vfllcms,bohr_vfllcms_staging
#   uv run ansible-playbook -i inventories playbooks/vfllcms/playbook.yml -l bohr,bohr_vfllcms \
#     -e vfllcms_restore_dump=~/Backups/bohr-native-<ts>/vfllcms.pgdump
# Order matters: the network must exist before the compose stack joins it,
# and the data dirs before nginx bind-mounts them (nginx_resolver is set, so
# a missing upstream only gives a 502).
- name: Docker + shared network on the docker hosts
  hosts: vfllcms_docker_hosts
  roles:
    - docker_network

- name: Deploy VFLL Wagtail CMS
  hosts: vfllcms
  become: true
  roles:
    - vfllcms

- name: Reverse proxy + TLS on the docker hosts (nginx_proxies in host_vars/<host>)
  hosts: vfllcms_docker_hosts
  roles:
    - role: htpasswd
      tags: htpasswd
    - role: certbot
      tags: certbot
    - role: nginx
      tags: nginx
