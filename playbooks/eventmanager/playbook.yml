---
# Order matters: the network must exist before the compose stack joins it,
# and the web container (eventmanager_name) should run before nginx starts;
# faraday has nginx_resolver, so a missing upstream only gives a 502.
- name: Docker + shared network on faraday
  hosts: faraday
  roles:
    - docker_network

- name: Deploy VFLL Eventmanager
  hosts: eventmanager
  become: true
  roles:
    - eventmanager

- name: Reverse proxy + TLS on faraday (nginx_proxies in host_vars/faraday)
  hosts: faraday
  roles:
    - role: htpasswd
      tags: htpasswd
    - role: certbot
      tags: certbot
    - role: nginx
      tags: nginx
