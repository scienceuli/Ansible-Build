---
# Index App (github.com/scienceuli/indexapp). See HOW_TO_DEPLOY.md.
# Order matters: the network must exist before the compose stack joins it, and
# indexapp-web must be running before nginx tests its config (nginx -t resolves
# the upstream); the data dir must exist before nginx bind-mounts it.
- name: Docker + shared network on faraday
  hosts: faraday
  roles:
    - docker_network

- name: Deploy Index App
  hosts: indexapp
  become: true
  roles:
    - indexapp

- name: Reverse proxy + TLS on faraday (nginx_proxies in host_vars/faraday)
  hosts: faraday
  roles:
    - role: htpasswd
      tags: htpasswd
    - role: certbot
      tags: certbot
    - role: nginx
      tags: nginx
