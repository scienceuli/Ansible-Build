---
# nginx + certbot containers for hertz (nginx_proxies in host_vars/hertz).
# Host nginx must be stopped first (ports 80/443).
#   uv run ansible-playbook -i inventories playbooks/vfll_nextcloud/proxy.yml
- name: Reverse proxy + TLS on hertz
  hosts: hertz
  roles:
    - role: certbot
      tags: certbot
    - role: nginx
      tags: nginx
